name: npm Publish

# Manual, on-demand publishing only. Nothing here runs automatically on push:
# trigger it from Actions ("Run workflow") with publish=true. Authentication
# uses npm trusted publishing (OIDC) — no token secret needed. One-time
# setup: in the npmjs.com package settings, add this repo + workflow file as
# a trusted publisher. It also runs read-only validation whenever a GitHub
# Release is published.

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Existing GitHub Release tag to package (for example v1.0.0-rc.1)"
        required: true
        type: string
      publish:
        description: "Publish to npm after validation instead of stopping at the dry run"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dist-tag:
        description: "npm dist-tag to publish"
        required: true
        default: "beta"
        type: choice
        options:
          - "beta"
          - "rc"
          - "latest"
  release:
    types: [published]
  # `release: published` never fires here in practice. release.yml creates the
  # GitHub Release with the default GITHUB_TOKEN, and GitHub deliberately does
  # not trigger workflows from events raised by that token, to stop recursive
  # chains. Verified: across 15 npm-publish runs there were zero with
  # event=release.
  #
  # So chain off the release pipeline instead. `head_branch` carries the tag for
  # a tag-triggered run, and the publish job re-checks the checkout against the
  # tag and the release assets before it writes anything, so a run that is not
  # tied to a real published release cannot get through.
  workflow_run:
    # This matches the workflow's `name:`, not its filename. The file is
    # release.yml but the name is "Release Binaries"; using the filename here
    # would silently never match.
    workflows: ["Release Binaries"]
    types: [completed]

permissions:
  contents: read

concurrency:
  # Keyed by tag wherever a tag is known, so an automatic run and a manual
  # retry for the same release serialize instead of racing. Falls back to the
  # run id for triggers that carry no tag.
  group: npm-publish-${{ github.event.release.tag_name || inputs['release-tag'] || github.event.workflow_run.head_branch || github.event.run_id }}
  cancel-in-progress: false


jobs:
  smoke:
    name: Validate released npm package
    runs-on: ubuntu-22.04
    # Do not spend a runner validating a release pipeline that failed, and do
    # not start when there is no tag to bind to.
    if: >-
      github.event_name == 'release'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && startsWith(github.event.workflow_run.head_branch, 'v'))
    outputs:
      dist_tag: ${{ steps.identity.outputs.dist_tag }}
      package_version: ${{ steps.identity.outputs.package_version }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs['release-tag'] || github.event.workflow_run.head_branch }}
      REQUESTED_DIST_TAG: ${{ inputs['dist-tag'] }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs['release-tag'] || github.event.workflow_run.head_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Bind checkout to package version and release tag
        id: identity
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          test "$RELEASE_TAG" = "$expected_tag"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          dist_tag="$REQUESTED_DIST_TAG"
          if [ -z "$dist_tag" ]; then
            dist_tag="$(node -p "require('./package.json').publishConfig.tag")"
          fi
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
      - name: Read matching GitHub Release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release view "$RELEASE_TAG" --repo NexaraAI/axiom-agent
          --json tagName,isDraft,isPrerelease,assets
          > "$RUNNER_TEMP/axiom-release.json"
      - name: Validate dist-tag, changelog, and release assets
        env:
          NPM_DIST_TAG: ${{ steps.identity.outputs.dist_tag }}
        run: >-
          node scripts/check-publish-readiness.js
          --tag "$RELEASE_TAG"
          --dist-tag "$NPM_DIST_TAG"
          --release-json "$RUNNER_TEMP/axiom-release.json"
      - name: Run source smoke tests
        run: npm run smoke
      - name: Install and execute the packed tarball
        run: npm run packed-smoke
      - name: Check package contents
        run: npm pack --dry-run

  publish:
    name: Publish immutable npm version
    runs-on: ubuntu-22.04
    needs: smoke
    # Automatic once a tagged release pipeline succeeds. workflow_dispatch keeps
    # `publish` as an explicit opt-in so a retry stays deliberate; a release
    # published outside CI publishes too. The smoke gate above must have run,
    # and `--assert-unpublished` below still rejects an already-published
    # version, so a duplicate trigger cannot publish twice.
    if: >-
      github.event_name == 'release'
      || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
      || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    environment:
      name: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      NPM_DIST_TAG: ${{ needs.smoke.outputs.dist_tag }}
      RELEASE_TAG: ${{ needs.smoke.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ needs.smoke.outputs.release_tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Pin trusted-publishing npm CLI
        run: npm install --global npm@11.5.1
      - name: Reconfirm exact release checkout
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$package_version" = "${{ needs.smoke.outputs.package_version }}"
          test "$RELEASE_TAG" = "v${package_version}"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
      - name: Re-read matching GitHub Release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release view "$RELEASE_TAG" --repo NexaraAI/axiom-agent
          --json tagName,isDraft,isPrerelease,assets
          > "$RUNNER_TEMP/axiom-release.json"
      - name: Re-run source and packed-package smoke tests
        run: |
          npm run smoke
          npm run packed-smoke
      - name: Reject reused versions and revalidate release assets
        run: >-
          node scripts/check-publish-readiness.js
          --tag "$RELEASE_TAG"
          --dist-tag "$NPM_DIST_TAG"
          --release-json "$RUNNER_TEMP/axiom-release.json"
          --assert-unpublished
      - name: Publish with npm trusted publishing
        run: npm publish --tag "$NPM_DIST_TAG"

schema_version = "1.0"
id = "web.fetch"
name = "Fetch Web Text"
version = "0.1.0"
description = "Fetches public URL text or searches online documentation and topics."
category = "web"
skill_type = "tool"
risk_level = "medium"
permissions = ["network"]
platforms = ["windows", "linux", "macos"]
entrypoint = "builtin:web.fetch"
author = "Axiom Agent"
license = "MIT"
min_axiom_version = "0.1.0"

[llm_card]
summary = "Fetch text from a specific URL or search the web for documentation, libraries, platforms, or unfamiliar topics."
when_to_use = [
    "Before taking action or answering questions about unfamiliar frameworks, APIs, platforms, or tools",
    "User asks to search, find, or research a topic on the web",
    "User asks to find platforms, packages, or documentation",
    "User provides a URL to read"
]
input_contract = "url (string), query (string search query), timeout_ms, max_bytes"
output_contract = "status, text, content_type"
token_budget = 220
